<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Яєчний Інкубатор 2.3.1 🥚</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #1e1208, #4a3520);
      color: #ffeedd;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      touch-action: manipulation;
    }
    #app {
      width: 100%;
      max-width: 500px;
      background: rgba(15, 8, 4, 0.55);
      border-radius: 40px;
      padding: 20px 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,200,100,0.2);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
    }
    h1 { font-size: 1.9rem; margin-bottom: 0; text-shadow: 0 0 15px #f90; }
    .version { font-size: 0.7rem; opacity: 0.7; margin-bottom: 5px; }
    .stats {
      display: flex;
      justify-content: space-around;
      background: #00000044;
      border-radius: 25px;
      padding: 12px;
      margin: 10px 0;
      font-weight: bold;
      flex-wrap: wrap;
    }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat-value { font-size: 1.8rem; color: #ffeAA0; }
    .egg-area { position: relative; margin: 15px 0; }
    .egg-container { cursor: pointer; display: inline-block; transition: transform 0.05s; position: relative; }
    .egg-container:active { transform: scale(0.88); }
    .egg-img { font-size: 7rem; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6)); transition: 0.2s; }
    .float-text {
      position: absolute; color: #ffe484; font-weight: bold; font-size: 1.8rem;
      pointer-events: none; animation: floatAnim 0.9s ease-out forwards; white-space: nowrap;
      text-shadow: 0 2px 5px black;
    }
    @keyframes floatAnim {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.3); }
    }
    .fast-upgrades {
      display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap;
    }
    .fast-btn {
      background: #b85e0c; color: white; font-weight: bold; padding: 8px 14px; border-radius: 25px;
      border: none; cursor: pointer; font-size: 0.85rem; white-space: nowrap;
    }
    .fast-btn:disabled { background: #555; color: #aaa; }
    .boost-bar { height: 6px; background: #444; border-radius: 3px; margin: 8px 0; overflow: hidden; display: none; }
    .boost-fill { height: 100%; background: linear-gradient(90deg, #f90, #ff0); width: 0%; transition: width 0.1s linear; }
    .tabs { display: flex; margin: 10px 0 5px; background: #00000033; border-radius: 25px; overflow: hidden; }
    .tab { flex: 1; padding: 10px 5px; background: transparent; border: none; color: #ccaa88; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
    .tab.active { background: #b8753b; color: white; box-shadow: inset 0 -3px 0 #ffe484; }
    .panel { max-height: 380px; overflow-y: auto; background: #00000022; border-radius: 20px; padding: 10px; scrollbar-width: thin; }
    .upgrade, .prestige-item, .achievement, .shop-item {
      display: flex; justify-content: space-between; align-items: center; background: #ffffff10;
      border-radius: 18px; padding: 10px; margin: 6px 0; gap: 8px; text-align: left; flex-wrap: wrap;
    }
    .upgrade-info, .prestige-info { flex: 2; min-width: 150px; }
    .upgrade-name, .prestige-name, .shop-name { font-weight: bold; font-size: 1rem; }
    .upgrade-desc, .shop-desc { font-size: 0.75rem; opacity: 0.8; }
    button {
      background: #ea933b; border: none; color: white; font-weight: bold; padding: 8px 14px;
      border-radius: 30px; cursor: pointer; transition: 0.2s; white-space: nowrap; font-size: 0.9rem;
    }
    button:disabled { background: #555; color: #aaa; }
    button:not(:disabled):hover { filter: brightness(1.2); }
    .gold-btn { background: #d4a017; }
    .boost-btn { background: #4caf50; }
    .small-btn { background: #444; padding: 6px 14px; font-size: 0.8rem; }
    .settings-btn { background: #607d8b; }
    .daily-btn { background: #ab47bc; font-size: 1rem; width: 100%; margin-top: 10px; }
    .quest-item { display: flex; align-items: center; gap: 10px; background: #ffffff10; border-radius: 15px; padding: 8px; margin: 5px 0; }
    .quest-progress { flex: 1; height: 8px; background: #444; border-radius: 4px; overflow: hidden; }
    .quest-fill { height: 100%; background: #ffd700; }
    .event-btn {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #f44336;
      font-size: 2rem; padding: 15px 30px; border-radius: 60px; box-shadow: 0 0 30px gold;
      z-index: 1000; animation: pulse 0.8s infinite;
    }
    @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.1); } 100% { transform: translateX(-50%) scale(1); } }
    .notification {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #2e1e0e; color: #ffcc88; padding: 12px 25px; border-radius: 30px;
      box-shadow: 0 5px 20px black; font-weight: bold; z-index: 999;
      animation: slideDown 0.5s ease, fadeOut 0.5s 2.5s forwards;
    }
    @keyframes slideDown { from { top: -80px; opacity: 0; } to { top: 20px; opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; top: -20px; } }
    .footer-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    #exportImport { display: none; margin-top: 8px; gap: 5px; flex-direction: column; }
    #saveString { flex: 1; padding: 8px; border-radius: 15px; border: none; background: #fff3e0; width: 100%; }
    .achievements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .settings-panel, .tutorial-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center;
      flex-direction: column;
    }
    .settings-panel.active, .tutorial-overlay.active { display: flex; }
    .settings-panel > div, .tutorial-content {
      background: #2e1e0e; border: 2px solid gold; border-radius: 25px; padding: 20px;
      max-width: 350px; width: 90%; text-align: left; color: white;
    }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    .setting-toggle { width: 50px; height: 25px; background: #555; border-radius: 15px; position: relative; cursor: pointer; }
    .setting-toggle.active { background: #4caf50; }
    .setting-toggle::after { content: ''; position: absolute; width: 21px; height: 21px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.2s; }
    .setting-toggle.active::after { left: 27px; }
    .tutorial-highlight {
      position: absolute; border: 3px solid gold; border-radius: 20px; pointer-events: none;
      box-shadow: 0 0 20px gold; z-index: 201; display: none;
    }
  </style>
</head>
<body>
<div id="app">
  <h1>🥚 Яєчний Інкубатор</h1>
  <div class="version">v2.3.1 · Туторіал · Вібрація · Баланс</div>
  <div class="stats">
    <div class="stat"><span class="stat-value" id="eggDisplay">0</span>🥚</div>
    <div class="stat"><span class="stat-value" id="epsDisplay">0</span>/с</div>
    <div class="stat"><span class="stat-value" style="color:#ffd700" id="goldDisplay">0</span>🥇</div>
  </div>
  <div class="boost-bar" id="boostBar"><div class="boost-fill" id="boostFill"></div></div>
  <div class="egg-area">
    <div class="egg-container" id="eggBtn">
      <span class="egg-img" id="eggEmoji">🥚</span>
    </div>
    <div id="floatContainer"></div>
  </div>
  <div class="fast-upgrades" id="fastUpgrades"></div>
  <button class="boost-btn" id="activateBoost">⚡ Буст x2 (<span id="boostCost">5000</span>🥚)</button>
  <button class="daily-btn" id="dailyBtn" style="display:none;">🎁 Забрати щоденний бонус</button>

  <div class="tabs">
    <button class="tab active" id="tabUpgrades">🔧</button>
    <button class="tab" id="tabShop">🛍️</button>
    <button class="tab" id="tabPrestige">🌟</button>
    <button class="tab" id="tabAchievements">🏆</button>
    <button class="tab" id="tabQuests">🎯</button>
  </div>

  <div id="upgradesPanel" class="panel"></div>
  <div id="shopPanel" class="panel" style="display:none;"></div>
  <div id="prestigePanel" class="panel" style="display:none;"></div>
  <div id="achievementsPanel" class="panel" style="display:none;"></div>
  <div id="questsPanel" class="panel" style="display:none;"></div>

  <div class="footer-buttons">
    <button class="small-btn" id="saveBtn">💾</button>
    <button class="small-btn settings-btn" id="settingsBtn">⚙️</button>
    <button class="small-btn" id="tutorialBtn">❓</button>
    <button class="small-btn" id="exportBtn">📋</button>
    <button class="small-btn" id="resetBtn">🔄</button>
  </div>
  <div id="exportImport">
    <input id="saveString" placeholder="Вставте код збереження..." />
    <button id="importBtn">📥 Імпорт</button>
  </div>
</div>

<!-- Панель налаштувань -->
<div class="settings-panel" id="settingsPanel">
  <div>
    <h3>⚙️ Налаштування</h3>
    <div class="setting-row">
      <span>📳 Вібрація при кліку</span>
      <div class="setting-toggle active" id="vibroToggle"></div>
    </div>
    <button id="closeSettings" style="margin-top: 15px; width: 100%;">Закрити</button>
  </div>
</div>

<!-- Туторіал оверлей -->
<div class="tutorial-overlay" id="tutorialOverlay">
  <div class="tutorial-content" id="tutorialContent">
    <p id="tutorialText"></p>
    <button id="tutorialNext">Далі</button>
    <button id="tutorialSkip">Пропустити</button>
  </div>
</div>
<div class="tutorial-highlight" id="tutorialHighlight"></div>

<script>
(function() {
  const defaultState = {
    eggs: 0,
    goldEggs: 0,
    prestigeMultiplier: 0,
    upgrades: {},
    shopUpgrades: {},
    totalProduced: 0,
    totalClicks: 0,
    lastSaveTime: null,
    achievements: [],
    boostUntil: null,
    prestigeShop: { startingEggs: 0, clickPower: 0, costReduction: 0 },
    lastDailyClaim: null,
    vibroEnabled: true,
    dailyQuests: { date: null, quests: [] }
  };

  let state = JSON.parse(JSON.stringify(defaultState));

  const upgradesData = [
    { id: 'hand',      name: 'Рука',        desc: '+1 до кліку',              baseCost: 10,    effect: 'click', value: 1 },
    { id: 'chicken',   name: 'Курка',       desc: '+0.5 яєць/с',              baseCost: 50,    effect: 'eps', value: 0.5 },
    { id: 'nest',      name: 'Гніздо',      desc: '+2 яєць/с',                baseCost: 200,   effect: 'eps', value: 2 },
    { id: 'farm',      name: 'Ферма',       desc: '+10 яєць/с',               baseCost: 1000,  effect: 'eps', value: 10 },
    { id: 'factory',   name: 'Фабрика',     desc: '+50 яєць/с',               baseCost: 5000,  effect: 'eps', value: 50 },
    { id: 'lab',       name: 'Лабораторія', desc: '+250 яєць/с',              baseCost: 25000, effect: 'eps', value: 250 },
    { id: 'quantum',   name: 'Квантовий інкубатор', desc: '+1200 яєць/с',     baseCost: 100000,effect: 'eps', value: 1200 },
    { id: 'robot',     name: 'Робо-рука',   desc: 'Автоклік 1 раз/с',         baseCost: 500,   effect: 'autoclick', value: 1 },
    { id: 'goldChick', name: 'Золота курка',desc: '10% шанс подвійного кліку',baseCost: 2000,  effect: 'crit', value: 0.1 },
    { id: 'portal',    name: 'Яйце-портал', desc: '+5% до EPS за рівень',     baseCost: 10000, effect: 'epsPercent', value: 0.05 },
    { id: 'star',      name: 'Зоряне яйце', desc: '+5000 яєць/с',             baseCost: 500000,effect: 'eps', value: 5000 }
  ];

  const shopItems = [
    { id: 'goldenNest',   name: 'Золоте гніздо',      desc: '+50% EPS',               cost: 5000000,   effect: 'epsMult', val: 1.5 },
    { id: 'teleport',     name: 'Телепорт яєць',       desc: 'Автоклік +10/с',         cost: 15000000,  effect: 'autoclick', val: 10 },
    { id: 'eggTower',     name: 'Яєчна вежа',          desc: '+10 до сили кліку',      cost: 10000000,  effect: 'click', val: 10 },
    { id: 'incubator3k',  name: 'Інкубатор 3000',      desc: '+25 000 яєць/с',         cost: 50000000,  effect: 'eps', val: 25000 },
    { id: 'quantumLink',  name: 'Квантовий зв\'язок',  desc: 'Множник EPS x1.2',      cost: 80000000,  effect: 'epsMult', val: 1.2 },
    { id: 'dragonEgg',    name: 'Яйце дракона',        desc: 'Крит. шанс +20%',       cost: 120000000, effect: 'critAdd', val: 0.2 },
    { id: 'cosmicPortal', name: 'Міжвимірний портал',  desc: 'Автоклік +100/с',       cost: 300000000, effect: 'autoclick', val: 100 },
    { id: 'timeMachine',  name: 'Машина часу',         desc: 'EPS x2 назавжди',       cost: 500000000, effect: 'epsMult', val: 2 }
  ];

  const achievementsList = [
    { id: 'first100', name: 'Перша сотня', desc: '100 яєць', check: s => s.eggs >= 100 },
    { id: 'clicker', name: 'Клікер', desc: '50 кліків', check: s => s.totalClicks >= 50 },
    { id: 'chickenLord', name: 'Курячий лорд', desc: '5 курок', check: s => (s.upgrades['chicken']||0) >= 5 },
    { id: 'golden1', name: 'Перше золото', desc: 'Золоте яйце', check: s => s.goldEggs + s.prestigeMultiplier >= 1 },
    { id: 'rich', name: 'Мільйонер', desc: '1M яєць', check: s => s.eggs >= 1_000_000 },
    { id: 'robotArmy', name: 'Армія роботів', desc: '10 робо-рук', check: s => (s.upgrades['robot']||0) >= 10 },
    { id: 'speed', name: 'Швидкість', desc: 'EPS > 10k', check: s => calculateEPS() > 10000 },
  ];

  function getUpgradeCost(id) {
    const u = upgradesData.find(x => x.id === id);
    if (!u) return Infinity;
    const owned = state.upgrades[id] || 0;
    let base = u.baseCost;
    if (state.prestigeShop.costReduction) base *= (1 - state.prestigeShop.costReduction / 100);
    return Math.floor(base * Math.pow(1.2, owned));
  }

  function calculateEPS() {
    let eps = 0;
    upgradesData.forEach(u => {
      if (u.effect === 'eps') eps += u.value * (state.upgrades[u.id] || 0);
      if (u.effect === 'epsPercent') eps *= (1 + u.value * (state.upgrades[u.id] || 0));
    });
    shopItems.forEach(item => {
      if (state.shopUpgrades[item.id]) {
        if (item.effect === 'eps') eps += item.val;
        if (item.effect === 'epsMult') eps *= item.val;
      }
    });
    const mult = 1 + state.prestigeMultiplier * 0.10;
    eps *= mult;
    if (state.boostUntil && Date.now() < state.boostUntil) eps *= 2;
    return eps;
  }

  function getClickPower() {
    let base = 1 + (state.upgrades['hand'] || 0) + state.prestigeShop.clickPower;
    shopItems.forEach(item => { if (state.shopUpgrades[item.id] && item.effect === 'click') base += item.val; });
    let critChance = Math.min(1, (state.upgrades['goldChick'] || 0) * 0.1);
    shopItems.forEach(item => { if (state.shopUpgrades[item.id] && item.effect === 'critAdd') critChance += item.val; });
    if (Math.random() < critChance) base *= 2;
    const mult = 1 + state.prestigeMultiplier * 0.10;
    base *= mult;
    if (state.boostUntil && Date.now() < state.boostUntil) base *= 2;
    return base;
  }

  function formatNumber(num) {
    if (num < 1000) return Math.floor(num).toString();
    const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
    let tier = 0, val = num;
    while (val >= 1000 && tier < suffixes.length-1) { val /= 1000; tier++; }
    return val.toFixed(1) + suffixes[tier];
  }

  function applyOfflineEarnings() {
    if (!state.lastSaveTime) return 0;
    try {
      const now = Date.now();
      const last = new Date(state.lastSaveTime).getTime();
      const diffSeconds = Math.min((now - last) / 1000, 43200);
      if (diffSeconds < 10) return 0;
      const eps = calculateEPS();
      const gained = (eps * diffSeconds) / 2;
      state.eggs += gained;
      state.totalProduced += gained;
      return gained;
    } catch(e) { return 0; }
  }

  function showNotification(text) {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.textContent = text;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  function vibrate(ms = 5) {
    if (state.vibroEnabled && navigator.vibrate) {
      try { navigator.vibrate(ms); } catch(e) {}
    }
  }

  function updateEggAppearance() {
    const emoji = document.getElementById('eggEmoji');
    if (!emoji) return;
    const total = state.totalProduced + state.eggs;
    if (total > 100_000_000) emoji.textContent = '🌌';
    else if (total > 10_000_000) emoji.textContent = '🐉';
    else if (total > 1_000_000) emoji.textContent = '💎';
    else if (total > 100_000) emoji.textContent = '🥚🌟';
    else if (total > 10_000) emoji.textContent = '🥚✨';
    else emoji.textContent = '🥚';
  }

  function getBestUpgrade(type) {
    const possible = upgradesData.filter(u => u.effect === type && state.eggs >= getUpgradeCost(u.id));
    if (possible.length === 0) return null;
    possible.sort((a,b) => getUpgradeCost(a.id) - getUpgradeCost(b.id));
    return possible[0];
  }

  function renderFastUpgrades() {
    const container = document.getElementById('fastUpgrades');
    container.innerHTML = '';
    const bestClick = getBestUpgrade('click');
    const bestEps = getBestUpgrade('eps');
    if (bestClick) {
      const btn = document.createElement('button');
      btn.className = 'fast-btn';
      btn.textContent = `👆 ${bestClick.name} (${formatNumber(getUpgradeCost(bestClick.id))})`;
      btn.addEventListener('click', () => {
        if (state.eggs >= getUpgradeCost(bestClick.id)) {
          state.eggs -= getUpgradeCost(bestClick.id);
          state.upgrades[bestClick.id] = (state.upgrades[bestClick.id]||0) + 1;
          updateUI();
          vibrate();
        }
      });
      container.appendChild(btn);
    }
    if (bestEps) {
      const btn = document.createElement('button');
      btn.className = 'fast-btn';
      btn.textContent = `⚡ ${bestEps.name} (${formatNumber(getUpgradeCost(bestEps.id))})`;
      btn.addEventListener('click', () => {
        if (state.eggs >= getUpgradeCost(bestEps.id)) {
          state.eggs -= getUpgradeCost(bestEps.id);
          state.upgrades[bestEps.id] = (state.upgrades[bestEps.id]||0) + 1;
          updateUI();
          vibrate();
        }
      });
      container.appendChild(btn);
    }
  }

  function renderUpgrades() {
    const panel = document.getElementById('upgradesPanel');
    panel.innerHTML = '';
    upgradesData.forEach(u => {
      const owned = state.upgrades[u.id] || 0;
      const cost = getUpgradeCost(u.id);
      const canBuy = state.eggs >= cost;
      const div = document.createElement('div'); div.className = 'upgrade';
      const info = document.createElement('div'); info.className = 'upgrade-info';
      info.innerHTML = `<div class="upgrade-name">${u.name} (${owned})</div><div class="upgrade-desc">${u.desc}</div>`;
      const btn = document.createElement('button');
      btn.textContent = `${formatNumber(cost)} 🥚`;
      btn.disabled = !canBuy;
      btn.addEventListener('click', () => {
        if (state.eggs >= getUpgradeCost(u.id)) {
          state.eggs -= getUpgradeCost(u.id);
          state.upgrades[u.id] = (state.upgrades[u.id]||0) + 1;
          updateUI();
          vibrate();
        }
      });
      div.appendChild(info); div.appendChild(btn);
      panel.appendChild(div);
    });
  }

  function renderShop() {
    const panel = document.getElementById('shopPanel');
    panel.innerHTML = '';
    shopItems.forEach(item => {
      const bought = state.shopUpgrades[item.id] === true;
      const canBuy = !bought && state.eggs >= item.cost;
      const div = document.createElement('div'); div.className = 'shop-item';
      const info = document.createElement('div'); info.className = 'upgrade-info';
      info.innerHTML = `<div class="shop-name">${item.name}</div><div class="shop-desc">${item.desc}</div>`;
      const btn = document.createElement('button');
      btn.textContent = bought ? '✅' : `${formatNumber(item.cost)} 🥚`;
      btn.disabled = !canBuy;
      btn.addEventListener('click', () => {
        if (!bought && state.eggs >= item.cost) {
          state.eggs -= item.cost;
          state.shopUpgrades[item.id] = true;
          updateUI();
          showNotification('🛍️ Куплено: ' + item.name);
          vibrate();
        }
      });
      div.appendChild(info); div.appendChild(btn);
      panel.appendChild(div);
    });
  }

  function renderPrestige() {
    const panel = document.getElementById('prestigePanel');
    panel.innerHTML = '';
    const baseCost = 5_000_000;
    const increment = 3_000_000;
    const ownedGold = state.goldEggs + state.prestigeMultiplier;
    const nextGoldCost = baseCost + ownedGold * increment;
    const canPrestige = state.eggs >= nextGoldCost;

    const header = document.createElement('div'); header.className = 'prestige-info';
    header.style.textAlign = 'center'; header.innerHTML = '<strong>🌟 Престиж</strong><br><small>Скидає яйця та покращення, дає золоте</small>';
    panel.appendChild(header);
    const p = document.createElement('p'); p.innerHTML = `Наступне: <strong>${formatNumber(nextGoldCost)} 🥚</strong>`;
    panel.appendChild(p);
    const btnPrestige = document.createElement('button'); btnPrestige.className = 'gold-btn';
    btnPrestige.textContent = '🌟 Здобути Золоте!'; btnPrestige.disabled = !canPrestige;
    btnPrestige.addEventListener('click', () => {
      if (state.eggs >= nextGoldCost) {
        state.eggs = state.prestigeShop.startingEggs * 100;
        state.upgrades = {}; state.shopUpgrades = {};
        state.goldEggs++; state.boostUntil = null;
        updateUI();
        showNotification('🌟 Отримано золоте яйце!');
        vibrate();
      }
    });
    panel.appendChild(btnPrestige);
    panel.appendChild(document.createElement('hr'));

    const shopTitle = document.createElement('h3'); shopTitle.textContent = '🛒 Магазин престижу';
    panel.appendChild(shopTitle);

    function addPrestigeItem(title, desc, costGold, callback) {
      const div = document.createElement('div'); div.className = 'prestige-item';
      const info = document.createElement('div'); info.className = 'prestige-info';
      info.innerHTML = `<strong>${title}</strong><br><small>${desc}</small>`;
      const btn = document.createElement('button');
      btn.textContent = `${costGold} 🥇`; btn.disabled = state.goldEggs < costGold;
      btn.addEventListener('click', callback);
      div.appendChild(info); div.appendChild(btn);
      panel.appendChild(div);
    }
    addPrestigeItem('Глобальний множник', `+${(state.prestigeMultiplier*10).toFixed(0)}%`, 1, () => {
      if (state.goldEggs>=1) { state.goldEggs--; state.prestigeMultiplier++; updateUI(); }
    });
    addPrestigeItem('Стартові яйця', `+100 (рів.${state.prestigeShop.startingEggs})`, 1, () => {
      if (state.goldEggs>=1) { state.goldEggs--; state.prestigeShop.startingEggs++; updateUI(); }
    });
    addPrestigeItem('Сила кліку', `+1 (рів.${state.prestigeShop.clickPower})`, 2, () => {
      if (state.goldEggs>=2) { state.goldEggs -= 2; state.prestigeShop.clickPower++; updateUI(); }
    });
    addPrestigeItem('Знижка', `-5% (рів.${state.prestigeShop.costReduction}%)`, 3, () => {
      if (state.goldEggs>=3) { state.goldEggs -= 3; state.prestigeShop.costReduction += 5; updateUI(); }
    });
  }

  function renderAchievements() {
    const panel = document.getElementById('achievementsPanel');
    panel.innerHTML = '<div class="achievements-grid"></div>';
    const grid = panel.querySelector('.achievements-grid');
    achievementsList.forEach(a => {
      const earned = state.achievements.includes(a.id);
      const div = document.createElement('div'); div.className = 'achievement';
      div.style.opacity = earned ? '1' : '0.4';
      div.innerHTML = `<div>🏆 <strong>${a.name}</strong><br><small>${a.desc}</small></div><span>${earned ? '✅' : '🔒'}</span>`;
      grid.appendChild(div);
    });
  }

  function generateDailyQuests() {
    const quests = [
      { id: 'buyUpgrades', type: 'buy', target: 10, progress: 0, rewardEggs: 20000, desc: 'Купити 10 покращень' },
      { id: 'clicks', type: 'clicks', target: 200, progress: 0, rewardEggs: 15000, desc: 'Зробити 200 кліків' },
      { id: 'earnEggs', type: 'earn', target: 500000, progress: 0, rewardEggs: 50000, rewardGold: 0, desc: 'Заробити 500K яєць' }
    ];
    const random = quests.sort(() => Math.random() - 0.5).slice(0, 3);
    state.dailyQuests = { date: new Date().toISOString().split('T')[0], quests: random };
  }

  function renderQuests() {
    const panel = document.getElementById('questsPanel');
    if (!state.dailyQuests.date || state.dailyQuests.date !== new Date().toISOString().split('T')[0]) {
      generateDailyQuests();
    }
    const quests = state.dailyQuests.quests;
    panel.innerHTML = '';
    quests.forEach((q) => {
      let progress = 0;
      if (q.type === 'buy') progress = Object.values(state.upgrades).reduce((a,b) => a+b, 0);
      else if (q.type === 'clicks') progress = state.totalClicks;
      else if (q.type === 'earn') progress = state.totalProduced;
      q.progress = Math.min(progress, q.target);
      const pct = (q.progress / q.target) * 100;
      const div = document.createElement('div'); div.className = 'quest-item';
      div.innerHTML = `<div style="flex:2;">${q.desc}</div>
        <div style="flex:3;"><div class="quest-progress"><div class="quest-fill" style="width:${pct}%"></div></div></div>
        <div style="flex:1;">${q.progress}/${q.target}</div>`;
      panel.appendChild(div);
      if (q.progress >= q.target && !q.claimed) {
        q.claimed = true;
        state.eggs += q.rewardEggs;
        if (q.rewardGold) state.goldEggs += q.rewardGold;
        showNotification('🎯 Завдання виконано! +' + formatNumber(q.rewardEggs) + ' 🥚');
        updateUI();
      }
    });
  }

  // Оновлення буст-бару викликається окремо кожні ~50 мс з setInterval
  function updateBoostBar() {
    const bar = document.getElementById('boostBar');
    const fill = document.getElementById('boostFill');
    if (!bar || !fill) return;
    if (state.boostUntil && Date.now() < state.boostUntil) {
      bar.style.display = 'block';
      const remaining = state.boostUntil - Date.now();
      fill.style.width = Math.max(0, (remaining / 30000) * 100) + '%';
    } else {
      bar.style.display = 'none';
      if (state.boostUntil && Date.now() >= state.boostUntil) state.boostUntil = null;
    }
  }

  function updateUI() {
    document.getElementById('eggDisplay').textContent = formatNumber(state.eggs);
    document.getElementById('epsDisplay').textContent = formatNumber(calculateEPS());
    document.getElementById('goldDisplay').textContent = state.goldEggs + state.prestigeMultiplier;
    updateEggAppearance();

    const boostBtn = document.getElementById('activateBoost');
    const boostCost = 5000 * (state.boostUntil && Date.now() < state.boostUntil ? 2 : 1);
    document.getElementById('boostCost').textContent = formatNumber(boostCost);
    if (state.boostUntil && Date.now() < state.boostUntil) {
      boostBtn.textContent = '⚡ Активний (' + Math.ceil((state.boostUntil - Date.now())/1000) + 'с)';
    } else {
      boostBtn.innerHTML = '⚡ Буст x2 (<span id="boostCost">' + formatNumber(boostCost) + '</span>🥚)';
    }

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dailyBtn').style.display = (state.lastDailyClaim !== today) ? 'block' : 'none';

    renderFastUpgrades();
    renderUpgrades();
    renderShop();
    renderPrestige();
    renderAchievements();
    renderQuests();
    updateBoostBar();
  }

  // ---- Туторіал ----
  let tutorialStep = 0;
  const tutorialSteps = [
    { text: 'Ласкаво просимо до Яєчного Інкубатора! Натисни на велике яйце в центрі, щоб заробити перші яйця.', highlightId: 'eggBtn' },
    { text: 'Ось твої яйця та дохід у секунду. Щоб збільшити дохід, купуй покращення.', highlightId: 'tabUpgrades' },
    { text: 'Вкладка 🔧 — це покращення. Тут ти можеш витратити яйця, щоб збільшити клік або автоматичний дохід.', highlightId: 'upgradesPanel' },
    { text: 'У вкладці 🛍️ знаходяться дорогі мега-покращення, які скидаються після престижу.', highlightId: 'tabShop' },
    { text: 'Коли накопичиш багато яєць, зазирни у вкладку 🌟. За престиж ти отримаєш золоте яйце, але звичайний прогрес скинеться.', highlightId: 'tabPrestige' },
    { text: 'Щодня виконуй завдання 🎯 і забирай щоденний бонус (10% від балансу, від 100 до 1 млн яєць).', highlightId: 'tabQuests' },
    { text: 'Готово! Грай, розвивайся і не забувай заходити щодня. Вдалого кліку!', highlightId: null }
  ];

  function showTutorial() {
    tutorialStep = 0;
    document.getElementById('tutorialOverlay').classList.add('active');
    updateTutorialStep();
  }

  function updateTutorialStep() {
    if (tutorialStep >= tutorialSteps.length) {
      document.getElementById('tutorialOverlay').classList.remove('active');
      document.getElementById('tutorialHighlight').style.display = 'none';
      return;
    }
    const step = tutorialSteps[tutorialStep];
    document.getElementById('tutorialText').textContent = step.text;
    const highlight = document.getElementById('tutorialHighlight');
    if (step.highlightId) {
      const el = document.getElementById(step.highlightId);
      if (el) {
        const rect = el.getBoundingClientRect();
        highlight.style.display = 'block';
        highlight.style.top = rect.top + 'px';
        highlight.style.left = rect.left + 'px';
        highlight.style.width = rect.width + 'px';
        highlight.style.height = rect.height + 'px';
      } else {
        highlight.style.display = 'none';
      }
    } else {
      highlight.style.display = 'none';
    }
  }

  function nextTutorialStep() {
    tutorialStep++;
    updateTutorialStep();
  }

  document.getElementById('tutorialNext').addEventListener('click', nextTutorialStep);
  document.getElementById('tutorialSkip').addEventListener('click', () => {
    tutorialStep = tutorialSteps.length;
    updateTutorialStep();
  });
  document.getElementById('tutorialBtn').addEventListener('click', showTutorial);

  // Автоматичний туторіал для новачків (тільки якщо жодного кліку)
  if (state.totalClicks === 0 && state.eggs === 0) {
    setTimeout(showTutorial, 800);
  }

  // Подія "Яєчний дощ"
  function randomEvent() {
    if (document.querySelector('.event-btn')) return;
    const btn = document.createElement('button'); btn.className = 'event-btn';
    btn.textContent = '🥚🌧️ Яєчний дощ!';
    btn.addEventListener('click', () => {
      const bonus = calculateEPS() * 30;
      state.eggs += bonus; state.totalProduced += bonus;
      showNotification('🌧️ +' + formatNumber(bonus));
      btn.remove(); updateUI();
    });
    document.body.appendChild(btn);
    setTimeout(() => { if (btn.parentNode) btn.remove(); }, 10000);
  }

  // Планування локальних сповіщень (якщо доступно)
  async function scheduleReminders() {
    try {
      const { LocalNotifications } = window.Capacitor?.Plugins || {};
      if (!LocalNotifications) return;
      await LocalNotifications.requestPermissions();
      await LocalNotifications.cancel({ notifications: [{ id: 1001 }, { id: 1002 }, { id: 1003 }] });
      const now = Date.now();
      const messages = [
        'Твій завод яєць переповнений! Заходь забирати!',
        'Кури сумують без тебе... повернися!',
        'Ти пропускаєш тонни яєць! Запускай гру!'
      ];
      const delays = [30, 60, 120]; // хвилин
      for (let i = 0; i < delays.length; i++) {
        await LocalNotifications.schedule({
          notifications: [{
            id: 1001 + i,
            title: '🥚 Яєчний Інкубатор',
            body: messages[Math.floor(Math.random() * messages.length)],
            schedule: { at: new Date(now + delays[i] * 60000) }
          }]
        });
      }
    } catch(e) { /* ігноруємо помилки */ }
  }

  // Збереження
  function loadGame() {
    const saved = localStorage.getItem('eggClickerSave_v2');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed.goldEggs !== undefined && parsed.prestigeMultiplier === undefined) {
          parsed.prestigeMultiplier = parsed.goldEggs;
          parsed.goldEggs = 0;
        }
        state = Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
        if (!state.prestigeShop) state.prestigeShop = { startingEggs:0, clickPower:0, costReduction:0 };
        if (!state.dailyQuests) state.dailyQuests = { date: null, quests: [] };
        if (state.vibroEnabled === undefined) state.vibroEnabled = true;
      } catch(e) {}
    }
  }

  function saveGame() {
    state.lastSaveTime = new Date().toISOString();
    localStorage.setItem('eggClickerSave_v2', JSON.stringify(state));
    scheduleReminders(); // спроба запланувати сповіщення
  }

  // Старт
  loadGame();
  const gained = applyOfflineEarnings();
  if (gained > 0) showNotification('⏳ Офлайн-дохід: +' + formatNumber(gained) + ' 🥚 (макс 12 год)');
  updateUI();

  // Клік по яйцю
  document.getElementById('eggBtn').addEventListener('click', function(e) {
    const add = getClickPower();
    state.eggs += add; state.totalProduced += add; state.totalClicks++;
    const rect = this.getBoundingClientRect();
    const floatDiv = document.createElement('div'); floatDiv.className = 'float-text';
    floatDiv.textContent = '+' + formatNumber(add);
    floatDiv.style.left = (e.clientX - rect.left) + 'px';
    floatDiv.style.top = (e.clientY - rect.top) + 'px';
    document.getElementById('floatContainer').appendChild(floatDiv);
    setTimeout(() => floatDiv.remove(), 900);
    vibrate();
    updateUI();
  });

  // Автоклік та EPS
  setInterval(() => {
    let auto = state.upgrades['robot'] || 0;
    shopItems.forEach(item => { if (state.shopUpgrades[item.id] && item.effect === 'autoclick') auto += item.val; });
    if (auto > 0) { state.eggs += getClickPower() * auto; state.totalProduced += getClickPower() * auto; updateUI(); }
  }, 1000);

  setInterval(() => {
    const eps = calculateEPS();
    if (eps > 0) { state.eggs += eps/20; state.totalProduced += eps/20; updateUI(); }
    updateBoostBar();
  }, 50);

  document.getElementById('activateBoost').addEventListener('click', () => {
    const cost = 5000 * (state.boostUntil && Date.now() < state.boostUntil ? 2 : 1);
    if (state.eggs >= cost) { state.eggs -= cost; state.boostUntil = Date.now() + 30000; updateUI(); }
    else alert('Недостатньо яєць!');
  });

  document.getElementById('dailyBtn').addEventListener('click', () => {
    const today = new Date().toISOString().split('T')[0];
    if (state.lastDailyClaim !== today) {
      let bonus = Math.floor(state.eggs * 0.1);
      bonus = Math.max(100, Math.min(bonus, 1000000));
      state.eggs += bonus; state.totalProduced += bonus; state.lastDailyClaim = today;
      updateUI(); showNotification('🎁 Щоденний бонус: +' + formatNumber(bonus) + ' (10% від балансу)');
    }
  });

  // Налаштування
  const settingsPanel = document.getElementById('settingsPanel');
  const vibroToggle = document.getElementById('vibroToggle');
  vibroToggle.classList.toggle('active', state.vibroEnabled);
  vibroToggle.addEventListener('click', () => {
    state.vibroEnabled = !state.vibroEnabled;
    vibroToggle.classList.toggle('active', state.vibroEnabled);
    saveGame();
  });
  document.getElementById('settingsBtn').addEventListener('click', () => { settingsPanel.classList.add('active'); });
  document.getElementById('closeSettings').addEventListener('click', () => { settingsPanel.classList.remove('active'); });

  // Таби
  function switchTab(tab) {
    ['upgrades','shop','prestige','achievements','quests'].forEach(t => {
      document.getElementById(t+'Panel').style.display = (t === tab) ? 'block' : 'none';
      document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t === tab);
    });
  }
  document.getElementById('tabUpgrades').addEventListener('click', ()=> switchTab('upgrades'));
  document.getElementById('tabShop').addEventListener('click', ()=> switchTab('shop'));
  document.getElementById('tabPrestige').addEventListener('click', ()=> switchTab('prestige'));
  document.getElementById('tabAchievements').addEventListener('click', ()=> switchTab('achievements'));
  document.getElementById('tabQuests').addEventListener('click', ()=> switchTab('quests'));

  document.getElementById('saveBtn').addEventListener('click', ()=>{ saveGame(); showNotification('💾 Збережено!'); });
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    saveGame();
    const json = JSON.stringify(state);
    document.getElementById('exportImport').style.display = 'flex';
    document.getElementById('saveString').value = json;
    if (navigator.clipboard) navigator.clipboard.writeText(json).then(()=> showNotification('📋 Код скопійовано!'));
  });
  document.getElementById('importBtn').addEventListener('click', ()=>{
    const str = document.getElementById('saveString').value.trim();
    if (str) {
      try {
        const data = JSON.parse(str);
        if (data.eggs !== undefined) {
          state = Object.assign(JSON.parse(JSON.stringify(defaultState)), data);
          saveGame(); updateUI(); showNotification('📥 Імпортовано!');
        }
      } catch(e) { alert('Некоректний код!'); }
    }
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if (confirm('Видалити ВСЕ?')) { state = JSON.parse(JSON.stringify(defaultState)); saveGame(); updateUI(); }
  });

  setInterval(randomEvent, 180000 + Math.floor(Math.random() * 180000));
  setInterval(saveGame, 10000);
  window.addEventListener('beforeunload', saveGame);
})();
</script>
</body>
  </html>
